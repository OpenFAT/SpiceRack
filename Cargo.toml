[package]
name = "spicerack"
version = "0.2.0"
edition = "2024"
description = "Build SPICE circuits, generate netlists, run simulator backends, and read results"
repository = "https://github.com/OpenFAT/SpiceRack"
license = "MIT"
readme = "README.md"
keywords = ["spice", "simulation", "circuit", "netlist", "eda"]
categories = ["science", "simulation"]

[lib]
name = "spicerack"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "num-complex"], optional = true }
num-complex = "0.4"
thiserror = "2"
tempfile = { version = "3", optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[features]
default = ["python"]
# `backend`: the simulator backends (processes, temp files), `simulation`, the
# Verilog tools (OpenVAF, Icarus, Yosys) and `backend::check`.
# Without it the crate is the transpiler and the result readers: pure,
# no I/O, and it builds for wasm32-unknown-unknown.
backend = ["dep:tempfile", "dep:regex"]
python = ["dep:pyo3", "backend"]
# `corpus`: the nightly tier. Builds `tests/test_import_suite/`, which runs
# every spice-bench deck and corpus `nix develop .#testing` pins (about 20 min
# on a 4-vCPU runner), so the merge tier leaves it out. See TESTING.md.
corpus = []

[[test]]
name = "test_import_suite"
required-features = ["corpus"]

# The transpiler front end over every golden-gate input: the lexicon switch
# and the stages' throughput (TESTING.md, "Golden gate").
[[test]]
name = "test_syntax"
required-features = ["corpus"]

[[bin]]
name = "spice2rack"

# The transpiler rewrite's golden gate (TESTING.md, "Golden gate").
[[bin]]
name = "golden"
