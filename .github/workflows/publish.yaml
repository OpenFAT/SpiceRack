name: Publish

# Releasing a version is one click: Actions -> Publish -> Run workflow, pick
# the bump (patch/minor/major or an explicit X.Y.Z). One run then:
#   1. opens a pull request moving the version in Cargo.toml, pyproject.toml
#      and Cargo.lock (tools/bump_version.py);
#   2. runs the full test suite on that branch;
#   3. merges the pull request only if the tests passed;
#   4. at the merge commit, runs the Release workflow (tags.yaml: tests again,
#      wheels, sdist, the tag and the GitHub release);
#   5. uploads the same files to PyPI.
# It all happens in this run because a merge made with the run's own token
# starts no other workflow.
#
# A version bump merged by hand (a person editing the version in a pull
# request) still releases: that push to main runs `check`, then 4 and 5.
#
# One-time setup:
#   - PyPI: a trusted publisher for project "fast-spicerack": owner OpenFAT,
#     repository SpiceRack, workflow publish.yaml, environment pypi.
#   - GitHub: an environment named "pypi", and "Allow GitHub Actions to create
#     and approve pull requests" in the organization's and the repository's
#     Actions settings.

"on":
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an explicit X.Y.Z
        required: true
        default: patch
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ── One click: bump, test, merge ──
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      branch: ${{ steps.pr.outputs.branch }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump Cargo.toml, pyproject.toml and Cargo.lock
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 tools/bump_version.py "$BUMP" >> "$GITHUB_OUTPUT"

      - name: Open the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "release: v$VERSION"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "release: v$VERSION" \
            --body "Moves the version to $VERSION. The Publish run that opened this tests it, merges it, and releases v$VERSION to GitHub and PyPI.")
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"

  test:
    needs: bump
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ needs.bump.outputs.branch }}

  merge:
    needs: [bump, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Merge the tested release pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.bump.outputs.pr }}
        run: |
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --merge --delete-branch
          sha=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json mergeCommit -q .mergeCommit.oid)
          [ -n "$sha" ] || { echo "::error::pull request $PR has no merge commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # ── A version bump merged by hand ──
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A version this push moved, and not yet tagged?
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }
          v=$(version < pyproject.toml)
          git fetch -q --depth=1 origin "$BEFORE"
          was=$(git show "$BEFORE:pyproject.toml" | version)
          if [ "$v" = "$was" ]; then
            echo "pyproject.toml changed but the version is still $v; nothing to publish"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released; nothing to publish"
          else
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

  # ── Both paths: release and upload ──
  release:
    needs: [bump, merge, check]
    if: always() && (needs.merge.result == 'success' || needs.check.outputs.tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/tags.yaml
    with:
      tag: ${{ needs.check.outputs.tag || format('v{0}', needs.bump.outputs.version) }}
      ref: ${{ needs.merge.outputs.sha }}

  pypi:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fast-spicerack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
