name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # publish.yaml calls this with the tag to create once a version bump merges.
  workflow_call:
    inputs:
      tag:
        description: Tag to release, vX.Y.Z; created on the commit being built
        type: string
        required: true

permissions:
  contents: write

jobs:
  # ── Refuse a tag that disagrees with the manifests, then run the merge gate ──
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml and pyproject.toml
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG#v}"
          for f in Cargo.toml pyproject.toml; do
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$f" | head -1)
            [ "$v" = "$tag" ] || { echo "::error::$f is $v, tag is $tag"; exit 1; }
          done

  test:
    needs: version
    uses: ./.github/workflows/test.yaml

  # ── Python wheels (maturin) ──
  python:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          # One wheel per interpreter: the extension is not abi3. 3.14 needs pyo3 >= 0.25.
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          manylinux: auto

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # ── Python sdist ──
  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── GitHub Release ──
  release:
    needs: [python, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.whl' \) -exec cp {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
